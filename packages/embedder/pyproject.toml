[tool.poetry]
name = "luciverse-embedder"
version = "0.1.0"
description = "LuciVerse Embedder Service - Vector embeddings for NLP"
authors = ["LuciVerse Team"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sentence-transformers = "^2.3.0"
torch = "^2.1.0"
numpy = "^1.26.0"
prometheus-client = "^0.19.0"
pydantic = "^2.5.0"
pyyaml = "^6.0"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
httpx = "^0.25.0"
black = "^23.12.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
embedder = "embedder.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
